apiVersion: apps/v1
kind: Deployment
metadata:
  name: veiculos
  namespace: revenda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: veiculos
  template:
    metadata:
      labels:
        app: veiculos
    spec:
      containers:
        - name: veiculos
          image: IMAGE_VEICULOS
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: NODE_ENV
              value: production
            - name: VEICULOS_PORT
              value: "3002"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: veiculos_db
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: veiculos-db
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: veiculos-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veiculos-db
                  key: password
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: veiculos
  namespace: revenda
spec:
  selector:
    app: veiculos
  ports:
    - name: http
      port: 3002
      targetPort: http
