apiVersion: apps/v1
kind: Deployment
metadata:
  name: clientes
  namespace: revenda
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clientes
  template:
    metadata:
      labels:
        app: clientes
    spec:
      containers:
        - name: clientes
          image: IMAGE_CLIENTES
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: CLIENTES_PORT
              value: "3001"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: clientes_db
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: clientes-db
                  key: host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: clientes-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clientes-db
                  key: password
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: clientes
  namespace: revenda
spec:
  selector:
    app: clientes
  ports:
    - name: http
      port: 3001
      targetPort: http
